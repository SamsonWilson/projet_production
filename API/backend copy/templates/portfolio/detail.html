{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ item.title }} — Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/clean.css' %}">
</head>
<body>
  <div class="container py-5">
    <a href="{% url 'portfolio_list' %}" class="btn btn-link">← Retour au portfolio</a>
    <div class="row g-4 mt-3">
      <div class="col-lg-6">
        {% if item.cover_image %}
        <img src="{{ item.cover_image.url }}" class="img-fluid rounded" alt="{{ item.title }}">
        {% else %}
        <img src="{% static 'css/image/about-thumb.jpg' %}" class="img-fluid rounded" alt="{{ item.title }}">
        {% endif %}
      </div>
      <div class="col-lg-6">
        <h1>{{ item.title }}</h1>
        <p class="text-muted">{{ item.short_description }}</p>
        <div class="mt-4">{{ item.description|linebreaks }}</div>
        {% if item.video_url %}
        <div class="mt-4">
          <a href="{{ item.video_url }}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary">Voir la vidéo</a>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
