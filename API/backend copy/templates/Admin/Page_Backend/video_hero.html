{% load static %}

<!-- Hero Section - Video Background Component -->
<section class="hero-cinematic" id="home">
    <!-- La vidéo -->
    <video autoplay muted loop playsinline>
        <source src="{% static 'css/videos/HYUNDAI_Kinera_film (1).mp4' %}" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Le contenu par-dessus -->
    <div class="overlay-content text-center">
        <div class="container">
            <h6 class="text-uppercase fw-bold text-warning mb-3 animate__animated animate__fadeInDown" style="letter-spacing: 8px; font-size: 0.8rem;">
            
            </h6>
            <h1 class="display-2 fw-black text-white mb-4" style="font-family: 'Syncopate', sans-serif; letter-spacing: -2px;">
                KINERA <span style="color: var(--primary);">FILMS FIXERS</span>
            </h1>
            <div class="animate__animated animate__fadeInUp">
                <a href="{% url 'services' %}" class="btn btn-warning px-4 py-2 fw-bold rounded-0 text-uppercase" style="background: var(--primary); border:none;">
                    
                </a>
            </div>
        </div>
    </div>
</section>
