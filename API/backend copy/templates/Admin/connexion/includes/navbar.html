<style>
.main-navbar {
    background: rgba(26, 26, 46, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    height: 70px;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
}
.nav-container {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.nav-logo a {
    text-decoration: none;
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
}
.logo-highlight { color: #e94560; }
.nav-links { display: flex; align-items: center; gap: 20px; }
.nav-link { text-decoration: none; font-size: 14px; font-weight: 600; transition: all .3s; }
.link-login { color: #adb5bd; }
.link-login:hover { color: #fff; }
.btn-signup {
    background: linear-gradient(45deg, #e94560, #fb3640);
    color: #fff !important;
    padding: 9px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(233,69,96,.3);
}
.btn-signup:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,.5); }
.btn-logout {
    color: #e94560 !important;
    border: 1px solid #e94560;
    padding: 7px 16px;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .3s;
}
.btn-logout:hover { background: #e94560; color: #fff !important; }
.user-info {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,.05);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.1);
}
.user-badge {
    background: #ffd700;
    color: #000;
    font-size: 10px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 8px;
}
.user-email { color: #fff; font-size: 13px; }
@media (max-width: 768px) { .user-email { display: none; } }
</style>

<nav class="main-navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <a href="/"><span style="margin-right:8px;">🎬</span>VIDEO<span class="logo-highlight">PRODUCER</span></a>
        </div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <div class="user-info">
                    <span class="user-badge">PRO</span>
                    <span class="user-email">{{ user.email }}</span>
                </div>
                <form method="post" action="{% url 'deconnexion' %}" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="btn-logout">
                        <i class="bi bi-box-arrow-right me-1"></i> Déconnexion
                    </button>
                </form>
            {% else %}
                <a href="{% url 'connexion' %}" class="nav-link link-login">Connexion</a>
                <a href="{% url 'inscription' %}" class="nav-link btn-signup">S'inscrire</a>
            {% endif %}
        </div>
    </div>
</nav>
